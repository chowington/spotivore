apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: spotivore
  labels:
    app.kubernetes.io/name: spotivore
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: nginx
        image: spotivore_production_nginx:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: DJANGO_ADMIN_URL
          valueFrom:
            configMapKeyRef:
              name: spotivore-config
              key: DJANGO_ADMIN_URL
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: spotivore
  labels:
    app.kubernetes.io/name: spotivore
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
    name: http
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: spotivore
  labels:
    app.kubernetes.io/name: spotivore
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
    name: http
