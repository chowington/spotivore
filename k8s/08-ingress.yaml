apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spotivore-ingress
  namespace: spotivore
  labels:
    app.kubernetes.io/name: spotivore
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  rules:
  - host: spotivore.howington.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
