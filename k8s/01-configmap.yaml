apiVersion: v1
kind: ConfigMap
metadata:
  name: spotivore-config
  namespace: spotivore
  labels:
    app.kubernetes.io/name: spotivore
data:
  DJANGO_READ_DOT_ENV_FILE: "False"
  DJANGO_SETTINGS_MODULE: "config.settings.production"
  DJANGO_ALLOWED_HOSTS: "spotivore.howington.org,localhost,127.0.0.1,frontend,django"
  DJANGO_ADMIN_URL: "mWa7qwk3tUZXyrmpnGjy/"
  DJANGO_SECURE_SSL_REDIRECT: "True"
  DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
  DJANGO_SECURE_HSTS_PRELOAD: "True"
  DJANGO_SECURE_CONTENT_TYPE_NOSNIFF: "True"
  DJANGO_ACCOUNT_ALLOW_REGISTRATION: "False"
  USE_DOCKER: "yes"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "spotivore"
  POSTGRES_USER: "spotivore"
  REDIS_URL: "redis://redis:6379/0"
  SPOTIFY_CLIENT_ID: "1f9f77385be84819a18e2af962f839ba"
  SPOTIFY_REDIRECT_URI: "https://spotivore.howington.org/spotify/callback/"
  SPOTIFY_AUTH_SUCCESS_URL: "https://spotivore.howington.org/"
