apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: spotivore
  labels:
    app.kubernetes.io/name: spotivore
    app.kubernetes.io/component: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: django-media
  namespace: spotivore
  labels:
    app.kubernetes.io/name: spotivore
    app.kubernetes.io/component: backend
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
